# MCP Server — exposes agent tools (calculate, health checks, restart) via
# the Model Context Protocol so agents can discover and invoke them.
# Runtime dependencies are added in Iteration 6.

[project]
name = "mcp-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
