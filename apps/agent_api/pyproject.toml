# Agent API — user-facing FastAPI service that authenticates users and routes
# natural language requests to the agent orchestrator.
# Runtime dependencies are added in Iteration 2.

[project]
name = "agent-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
