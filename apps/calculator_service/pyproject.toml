# Calculator Service — FastAPI microservice that exposes arithmetic operations.
# Runtime dependencies (fastapi, uvicorn, etc.) are added in Iteration 1.
# Dev tooling (ruff, pyright, pytest) comes from the workspace root.

[project]
name = "calculator-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell hatchling the Python package to ship lives in the "app" directory.
[tool.hatch.build.targets.wheel]
packages = ["app"]
